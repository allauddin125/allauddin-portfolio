[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 and nodemailer 10 both require Node.js 20+.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `netlify dev` runs Vite and serves /.netlify/functions/* on http://localhost:8888
[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 3000
  port = 8888
